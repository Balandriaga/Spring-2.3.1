<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Список пользователей</title>
</head>
<body>
<h1>Список пользователей</h1>

<a href="/users/new">
  <button>Добавить нового пользователя</button>
</a>

<table border="1">
  <thead>
  <tr>
    <th>ID</th>
    <th>Имя</th>
    <th>Фамилия</th>
    <th>Возраст</th>
    <th>Адрес</th>
    <th>Действия</th>
  </tr>
  </thead>
  <tbody>
  <tr th:each="user : ${users}">
    <td th:text="${user.id}"></td>
    <td th:text="${user.name}"></td>
    <td th:text="${user.lastName}"></td>
    <td th:text="${user.age}"></td>
    <td th:text="${user.address}"></td>
    <td>
      <a th:href="@{/users/{id}(id=${user.id})}">Просмотр</a> |
      <a th:href="@{/users/{id}/edit(id=${user.id})}">Редактировать</a>
      <form th:action="@{/users/{id}/delete(id=${user.id})}" method="post" style="display:inline;">
        <button type="submit">Удалить</button>
      </form>
    </td>
  </tr>
  </tbody>
</table>

</body>
</html>
