<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Просмотр пользователя</title>
</head>
<body>
<h1>Данные пользователя</h1>
<p><strong>ID:</strong> <span th:text="${user.id}"></span></p>
<p><strong>Имя:</strong> <span th:text="${user.name}"></span></p>
<p><strong>Фамилия:</strong> <span th:text="${user.lastName}"></span></p>
<p><strong>Возраст:</strong> <span th:text="${user.age}"></span></p>
<p><strong>Адрес:</strong> <span th:text="${user.address}"></span></p>

<a href="/users">Назад к списку</a>
<a th:href="@{/users/{id}/edit(id=${user.id})}">
  <button>Редактировать</button>
</a>
<form th:action="@{/users/{id}/delete(id=${user.id})}" method="post" style="display:inline;">
  <button type="submit">Удалить</button>
</form>
</body>
</html>
